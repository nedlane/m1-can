[package]
name = "m1-can"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Inspect MoTeC M1 CAN topology and export .m1dbc databases as standard Vector .dbc files"
repository = "https://github.com/nedlane/m1-can"
publish = false

[[bin]]
name = "m1-can"
path = "src/main.rs"

[lib]
name = "m1_can"
path = "src/lib.rs"

[dependencies]
can-dbc = { version = "10", default-features = false }
clap = { version = "4", features = ["derive"] }
roxmltree = "0.21"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading the `[dbc]` section of `m1-tools.toml` only (src/config.rs).
# m1-workspace already pulls `toml` 1.x with default features into the lockfile,
# so naming it here adds no crate to the dependency graph. The crate's no-serde
# stance is unchanged: `[dbc]` is navigated as a `toml::Table`, never derived.
toml = "1"
m1-workspace = { git = "https://github.com/nedlane/m1-workspace.git", tag = "v0.13.0" }
m1-core = { git = "https://github.com/C-Nucifora/m1-core.git", tag = "v0.15.0" }
m1-typecheck = { git = "https://github.com/C-Nucifora/m1-typecheck.git", tag = "v0.50.0" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
