version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      m1-toolchain:
        patterns:
          - "m1-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # The MSRV job pins this action to the same toolchain as Cargo.toml's
      # rust-version, and the two only ever move together. A lone bump here
      # fails the job it is meant to run.
      - dependency-name: "dtolnay/rust-toolchain"
